[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twtt-data-tools"
version = "0.1.0"
description = "Measurement Plane TWTT client and data-analysis helpers"
requires-python = ">=3.10"
dependencies = [
    "measurement_plane @ git+https://github.com/measurement-plane/measurement_plane.git@main",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8",
    "jupyterlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
